<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--fundo-cor,#cfe3ef);font-family:var(--fonte,"Arima"),system-ui,sans-serif;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
#fundos{position:fixed;inset:0;z-index:0;overflow:hidden}
#fundo,#fundo-b{position:absolute;inset:0}
#fundo-escurecer{position:fixed;inset:0;z-index:0;pointer-events:none}
#palco{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;z-index:1}
.el{position:absolute;left:0;top:0;transform:translate(-50%,-50%);transition:opacity var(--t-sumir,700ms) ease}
.sumindo{opacity:0!important;pointer-events:none}
#personagem.sumindo #pers-sombra{animation:persSai var(--t-sumir,700ms) ease forwards}
@keyframes persSai{to{opacity:0;scale:.85;filter:blur(6px)}}
#personagem{z-index:10}
#pers-sombra{width:100%;height:100%}
#pers-sombra.com-sombra{filter:drop-shadow(0 8px 12px rgba(0,0,0,.15))}
#aki-img{width:100%;height:100%;object-fit:contain;display:block}
#aki-img.transicao{animation:trocaSuave var(--t-reacao,600ms) cubic-bezier(.4,0,.2,1) forwards}
@keyframes trocaSuave{0%{opacity:.65;filter:blur(2px);scale:.947}50%{opacity:.85;filter:blur(1px);scale:1.02}100%{opacity:1;filter:blur(0);scale:1}}
#painel{z-index:20;display:flex;flex-direction:column;gap:25px}
.question-box{display:flex;align-items:stretch;box-shadow:0 4px 10px rgba(0,0,0,.15);min-height:58px}
.question-number{background:var(--numero-fundo);color:var(--numero-texto);padding:18px 15px;font-weight:bold;font-size:var(--tam-numero);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:45px}
.question-number::before{content:'';position:absolute;left:-8px;top:56%;transform:translateY(-50%) rotate(-134deg);border-width:40px 39px 24px 0;border-style:solid;border-color:transparent var(--numero-fundo) transparent transparent;z-index:-1}
.question-number::after{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%) rotate(45deg);width:6px;height:6px;background:var(--losango)}
.diamante-baixo{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) rotate(45deg);width:6px;height:6px;background:var(--losango)}
.question-text{background:var(--pergunta-fundo);color:var(--pergunta-texto);padding:18px 25px;font-size:var(--tam-pergunta);font-weight:bold;flex:1;display:flex;align-items:center}
.loading-dots{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.loading-dots span{animation:blink 1.4s infinite both;font-size:2.2em;line-height:1;font-weight:bold;color:var(--pergunta-texto);display:inline-block}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%{opacity:.15;transform:scale(.8)}20%{opacity:1;transform:scale(1.2)}100%{opacity:.15;transform:scale(.8)}}
.answers-box{position:relative;background:var(--respostas-fundo);border:2px solid var(--respostas-borda);border-radius:2px;padding:10px 0;display:flex;flex-direction:column;width:100%;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.answers-box.disabled{pointer-events:none}
.answers-box.disabled .answer-option{opacity:.25}
.spinner-loader{display:none;position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border:4px solid var(--spinner-claro);border-top-color:var(--spinner);border-radius:50%;animation:spin .9s linear infinite;z-index:5}
@keyframes spin{to{transform:rotate(360deg)}}
.answers-box.disabled .spinner-loader{display:block}
.answer-option{position:relative;background:transparent;border:none;color:var(--resposta-texto);font-size:var(--tam-resposta);font-weight:bold;padding:14px 20px;cursor:pointer;text-align:center;width:100%;transition:background .2s ease,opacity .3s ease}
.answer-option::after{content:'»';position:absolute;right:25px;top:50%;transform:translateY(-50%);font-size:1.15em;opacity:0;transition:opacity .2s ease}
.answer-option:hover{background:linear-gradient(180deg,var(--hover1) 0%,var(--hover2) 100%);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.answer-option:hover::after{opacity:1}
#resultado{z-index:20;display:flex;flex-direction:column;align-items:center;gap:20px}
#resultado.aparecendo{animation:resultadoEntra var(--t-resultado,500ms) ease-out both}
@keyframes resultadoEntra{0%{opacity:0;translate:0 14px}100%{opacity:1;translate:0 0}}
.final-header-box{display:flex;flex-direction:column;background:var(--res-fundo);border:2px solid var(--res-borda);box-shadow:0 4px 15px rgba(0,0,0,.1);overflow:hidden;border-radius:2px}
.final-title-bar{background:var(--titulo-fundo);color:var(--titulo-texto);text-align:center;padding:10px;font-size:var(--tam-titulo);font-weight:bold;letter-spacing:1px;text-transform:uppercase}
.final-info-body{flex:1;justify-content:center;padding:20px 15px;display:flex;flex-direction:column;align-items:center;gap:5px}
.final-char-name{font-size:var(--tam-nome);font-weight:800;color:var(--nome-cor);line-height:1.2;text-align:center}
.final-char-desc{font-size:var(--tam-desc);color:var(--desc-cor);margin-bottom:15px;text-align:center}
.final-buttons{display:flex;align-items:center;justify-content:center;gap:25px;width:100%}
.btn-final{background:var(--botao-fundo);color:var(--botao-texto);border:none;padding:8px 45px;border-radius:20px;font-size:var(--tam-botao);font-weight:bold;cursor:pointer;transition:background-color .2s,transform .1s}
.btn-final:hover{background:var(--botao-hover);transform:scale(1.03)}
.diamond-divider{width:6px;height:6px;background:var(--losango);transform:rotate(45deg)}
.final-image-box{background:var(--res-fundo);border:2px solid var(--res-borda);box-shadow:0 4px 15px rgba(0,0,0,.08);padding:25px;display:flex;flex-direction:column;align-items:center;border-radius:2px;overflow:hidden;min-height:0}
.foto-moldura{position:relative;overflow:hidden;min-height:0;max-width:100%;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#final-img{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;transition:opacity .3s,filter .3s}
.foto-carregando{display:none;position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border:4px solid var(--spinner-claro);border-top-color:var(--spinner);border-radius:50%;animation:spin .9s linear infinite;z-index:2}
#resultado.carregando .foto-carregando{display:block}
#resultado.carregando #final-img{opacity:.25;filter:blur(2px)}
#resultado.carregando .final-buttons{pointer-events:none;opacity:.35}
.final-char-name .loading-dots{height:1.2em}
.final-char-name .loading-dots span{font-size:1em;color:var(--nome-cor)}
.final-credits{margin-top:15px;font-size:var(--tam-creditos);font-weight:bold;color:var(--creditos-cor);text-align:center}
.final-copyright{margin-top:4px;font-size:11px;color:var(--copyright-cor)}
#revelacao{z-index:30}
#revelacao.com-sombra{filter:drop-shadow(0 12px 20px rgba(0,0,0,.2))}
#reveal-img{width:100%;height:100%;object-fit:contain;display:block}
#reveal-img.revelando{animation:revelar var(--t-revelacao,1400ms) cubic-bezier(.2,.8,.2,1) both}
@keyframes revelar{0%{opacity:0;scale:.55;filter:blur(8px)}100%{opacity:1;scale:1;filter:blur(0)}}
.extra img{width:100%;height:auto;display:block}
.modo-editor [data-el]{cursor:move}
.modo-editor [data-el]:hover{outline:3px dashed rgba(255,61,127,.45);outline-offset:6px}
.modo-editor .selecionado,.modo-editor .selecionado:hover{outline:4px dashed #ff3d7f;outline-offset:6px}
.modo-editor .proprio{outline:3px dotted #ffb020;outline-offset:6px}
.modo-editor .proprio.selecionado,.modo-editor .proprio.selecionado:hover{outline:4px dashed #ffb020}
.modo-editor button{pointer-events:none}
.modo-editor img{pointer-events:none;-webkit-user-drag:none}
</style>
</head>

  function preencherPergunta(r, p) {
    qNum.textContent = numeroDe(r, p);
    qText.textContent = CFG.rodadas[r].perguntas[p].texto;
    montarRespostas(respostasDe(r, p));
    respostas.classList.remove('disabled');
  }
  // base: no "Continuar", o palpite (texto da barra e créditos vazios = iguais ao palpite)
  function preencherCartao(c, imgPadrao, base) {
    base = base || {};
    const t = CFG.textos, bar = $('txt-acho'), cr = $('final-credits');
    bar.textContent = c.titulo || base.titulo || t.euAchoQue;
    vis(bar, c.mostrarTitulo !== false);
    $('final-name').textContent = c.nome || '';
    $('final-desc').textContent = c.desc || '';
    const creditos = c.creditos || base.creditos || '';
    cr.textContent = creditos;
    vis(cr, !!(CFG.resultado.mostrarCreditos && creditos));
    $('btn-sim').textContent = c.sim || t.sim;
    $('btn-nao').textContent = c.nao || t.nao;
    setImg(fotoImg, c.imagem || imgPadrao, 'Imagem: ' + (c.nome || ''), 420, 420);
  }
  function preencherRevelacao(R) {
    setImg(revImg, R.revelacao.imagem, 'Imagem final aqui', 900, 900);
  }

  function limpar() {
    [elPers, elPainel, elRes, elRev].forEach((e) => e.classList.remove('sumindo', 'aparecendo', 'carregando'));
    extrasEls.forEach((e) => e.classList.remove('sumindo'));
    revImg.classList.remove('revelando');
    akiImg.classList.remove('transicao');
  }

  // Mostra um momento do roteiro sem animação (usado no editor e no começo do jogo)
  function mostrarEstatico(est) {
    estado = { tipo: est.tipo, r: est.r || 0, p: est.p || 0 };
    limpar();
    aplicarPosicoes();
    const R = CFG.rodadas[estado.r];
    let emRev = false;
    if (!R) {
      [elPainel, elRes, elRev].forEach((e) => vis(e, false));
      vis(elPers, true);
    } else if (estado.tipo === 'pergunta' && R.perguntas[estado.p]) {
      vis(elPainel, true); vis(elRes, false); vis(elRev, false); vis(elPers, true);
      preencherPergunta(estado.r, estado.p);
      trocarReacao(R.perguntas[estado.p].reacao, false);
    } else if (R.tipo === 'revelacao') {
      emRev = true;
      vis(elPainel, false); vis(elRes, false);
      vis(elPers, !R.revelacao.esconderPersonagem);
      preencherRevelacao(R);
      vis(elRev, true);
    } else {
      const cont = estado.tipo === 'continuar';
      const c = cartaoDe(R, cont ? 'continuar' : 'fim');
      vis(elPainel, false); vis(elRev, false); vis(elPers, true);
      preencherCartao(c, R.resultado.imagem, c === R.continuar ? R.resultado : null);
      vis(elRes, true);
      trocarReacao((cont && c.reacao) || R.resultado.reacao, false);
    }
    definirFundo(fundoDe(estado), false);
    visExtras(emRev);
    marcarSelecao();
  }

  // ---------------- JOGO ----------------
  function responder() {
    if (MODO === 'editor' || ocupado || estado.tipo !== 'pergunta') return;
    const R = CFG.rodadas[estado.r];
    if (!R) return;
    ocupado = true;
    respostas.classList.add('disabled');
    qText.innerHTML = PONTOS;
    setTimeout(() => {
      estado.p++;
      if (estado.p < R.perguntas.length) {
        aplicarPosicoes();
        preencherPergunta(estado.r, estado.p);
        trocarReacao(R.perguntas[estado.p].reacao);
        definirFundo(fundoDe(estado), true);
        ocupado = false;
      } else {
        fimDaRodada();
      }
    }, CFG.tempos.pensando);
  }

  function fimDaRodada() {
    const R = CFG.rodadas[estado.r];
    // revelação: o personagem some do jeito que estava na última pergunta
    if (R.tipo === 'revelacao') { revelar(R); return; }
    estado = { tipo: 'fim', r: estado.r, p: 0 };
    aplicarPosicoes();
    definirFundo(fundoDe(estado), true);
    mostrarResultado(R);
  }

  function mostrarResultado(R) {
    vis(elPainel, false); vis(elRev, false); vis(elPers, true);
    preencherCartao(R.resultado);
    vis(elRes, true);
    elRes.classList.remove('aparecendo');
    void elRes.offsetWidth;
    elRes.classList.add('aparecendo');
    trocarReacao(R.resultado.reacao);
    ocupado = false;
  }

  // clique no "Sim"/"Não" do cartão
  function clicarCartao() {
    if (MODO === 'editor' || ocupado) return;
    const R = CFG.rodadas[estado.r];
    if (!R) return;
    if (estado.tipo === 'fim' && R.tipo === 'resultado' && R.continuar && R.continuar.ativo) etapaContinuar(R);
    else if (estado.tipo === 'fim' || estado.tipo === 'continuar') proximaRodada();
  }

  // depois do palpite: carrega no próprio cartão, troca a foto e mostra "Continuar"
  function etapaContinuar(R) {
    ocupado = true;
    const c = R.continuar;
    elRes.classList.remove('aparecendo');
    elRes.classList.add('carregando');
    $('final-name').innerHTML = PONTOS;
    $('final-desc').textContent = '\u00a0'; // mantém a altura do cartão durante o carregamento
    if (c.reacao) trocarReacao(c.reacao);
    setTimeout(() => {
      estado = { tipo: 'continuar', r: estado.r, p: 0 };
      aplicarPosicoes();
      preencherCartao(c, R.resultado.imagem, c === R.continuar ? R.resultado : null);
      elRes.classList.remove('carregando');
      definirFundo(fundoDe(estado), true);
      ocupado = false;
    }, CFG.tempos.carregarCartao);
  }

  function proximaRodada() {
    const prox = estado.r + 1, R = CFG.rodadas[prox];
    if (!R) return;
    ocupado = true;
    estado = { tipo: 'pergunta', r: prox, p: 0 };
    aplicarPosicoes();
    visExtras(false);
    vis(elRes, false);
    elRes.classList.remove('aparecendo', 'carregando');
    vis(elPainel, true);
    respostas.classList.add('disabled');
    qNum.textContent = numeroDe(prox, 0);
    qText.innerHTML = PONTOS;
    trocarReacao(R.reacaoInicio || CFG.reacaoErrou);
    setTimeout(() => {
      if (R.perguntas.length) {
        preencherPergunta(prox, 0);
        trocarReacao(R.perguntas[0].reacao);
        definirFundo(fundoDe(estado), true);
        ocupado = false;
      } else {
        fimDaRodada();
      }
    }, CFG.tempos.pensando);
  }

  function revelar(R) {
    ocupado = true;
    const rv = R.revelacao;
    elPainel.classList.add('sumindo');
    elRes.classList.add('sumindo');
    if (rv.esconderPersonagem) elPers.classList.add('sumindo');
    (CFG.extras || []).forEach((x) => {
      const e = extrasEls.get(x.id);
      if (e && x.esconderNaRevelacao) e.classList.add('sumindo');
    });
    setTimeout(() => {
      vis(elPainel, false); vis(elRes, false);
      if (rv.esconderPersonagem) vis(elPers, false);
      estado = { tipo: 'fim', r: estado.r, p: 0 };
      aplicarPosicoes();
      definirFundo(fundoDe(estado), true);
      preencherRevelacao(R);
      vis(elRev, true);
      revImg.classList.remove('revelando');
      void revImg.offsetWidth;
      revImg.classList.add('revelando');
    }, CFG.tempos.sumir);
  }

  function iniciarJogo(r) {
    const R = CFG.rodadas[r];
    if (!R) return;
    estado = { tipo: 'pergunta', r: r, p: 0 };
    if (R.perguntas.length) mostrarEstatico(estado);
    else { aplicarPosicoes(); visExtras(false); vis(elPainel, false); fimDaRodada(); }
  }

  // ---------------- EDITOR ----------------
  function alvo(id, editar) {
    if (!id) return null;
    if (id === 'personagem') return persAtual();
    if (id === 'painel') return painelAtual();
    if (id === 'resultado') return CFG.resultado;
    const R = CFG.rodadas[estado.r];
    if (id === 'foto') return R ? (editar ? fotoParaEditar(R, estado.tipo) : fotoDe(R, estado.tipo)) : null;
    if (id === 'revelacao') return R ? R.revelacao : null;
    if (id.indexOf('extra:') === 0) return (CFG.extras || []).find((x) => x.id === id.slice(6)) || null;
    return null;
  }
  function marcarSelecao() {
    document.querySelectorAll('.selecionado').forEach((e) => e.classList.remove('selecionado'));
    if (MODO !== 'editor' || !selecionado) return;
    const e = palco.querySelector('[data-el="' + CSS.escape(selecionado) + '"]');
    if (e) e.classList.add('selecionado');
  }
  function enviar(m) { try { parent.postMessage(m, '*'); } catch (e) {} }

  function iniciarEditor() {
    document.body.classList.add('modo-editor');
    addEventListener('message', (ev) => {
      const m = ev.data || {};
      if (m.tipo !== 'atualizar') return;
      if (m.assets) { ASSETS = m.assets; NOMES = m.nomes || {}; fundoUrl = null; }
      if (m.config) { CFG = m.config; aplicarEstilos(); }
      if ('selecionado' in m) selecionado = m.selecionado;
      if (m.ignorar) ignorar = m.ignorar;
      mostrarEstatico(m.estado || estado);
    });

    let arr = null, pend = {}, pendId = null, tmr = null;
    const flush = () => { if (pendId) enviar({ tipo: 'alterar', el: pendId, r: estado.r, t: estado.tipo, p: estado.p, props: pend }); pend = {}; pendId = null; };
    const postar = (id, props) => {
      if (pendId && pendId !== id) { clearTimeout(tmr); flush(); }
      pendId = id; Object.assign(pend, props);
      clearTimeout(tmr); tmr = setTimeout(flush, 180);
    };
    const selecionar = (id) => {
      if (selecionado === id) return;
      selecionado = id; marcarSelecao(); enviar({ tipo: 'selecionar', el: id });
    };

    palco.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const alvoEl = e.target.closest('[data-el]');
      const id = alvoEl ? alvoEl.dataset.el : 'fundo';
      selecionado = id; marcarSelecao(); enviar({ tipo: 'selecionar', el: id });
      const o = alvo(id);
      if (!o) return;
      e.preventDefault();
      const foto = id === 'foto';
      arr = { id: id, o: o, kx: foto ? 'offX' : 'x', ky: foto ? 'offY' : 'y', sx: e.clientX, sy: e.clientY, mov: false };
      arr.ox = o[arr.kx]; arr.oy = o[arr.ky];
      arr.f = foto ? escala * (CFG.resultado.escala || 1) : escala;
      palco.setPointerCapture(e.pointerId);
    });
    palco.addEventListener('pointermove', (e) => {
      if (!arr) return;
      const dx = (e.clientX - arr.sx) / arr.f, dy = (e.clientY - arr.sy) / arr.f;
      if (!arr.mov && Math.abs(dx) + Math.abs(dy) < 2) return;
      if (!arr.mov) arr.o = alvo(arr.id, true);
      arr.mov = true;
      arr.o[arr.kx] = Math.round(arr.ox + dx);
      arr.o[arr.ky] = Math.round(arr.oy + dy);
      aplicarPosicoes();
    });
    const soltar = () => {
      if (arr && arr.mov) {
        const props = {}; props[arr.kx] = arr.o[arr.kx]; props[arr.ky] = arr.o[arr.ky];
        enviar({ tipo: 'alterar', el: arr.id, r: estado.r, t: estado.tipo, p: estado.p, props: props });
      }
      arr = null;
    };
    palco.addEventListener('pointerup', soltar);
    palco.addEventListener('pointercancel', soltar);

    palco.addEventListener('wheel', (e) => {
      const alvoEl = e.target.closest('[data-el]');
      if (!alvoEl) return;
      const id = alvoEl.dataset.el, o = alvo(id, true);
      if (!o) return;
      e.preventDefault();
      selecionar(id);
      const d = e.deltaY || e.deltaX;
      const dir = d < 0 ? 1 : -1;
      const props = {};
      if (e.altKey) {
        o.rotacao = Math.round(((o.rotacao || 0) + dir * (e.shiftKey ? 1 : 5)) * 10) / 10;
        props.rotacao = o.rotacao;
      } else {
        const k = id === 'foto' ? 'zoom' : 'escala';
        const passo = e.shiftKey ? 1.01 : 1.05;
        const atual = o[k] == null ? 1 : o[k];
        o[k] = Math.round(Math.min(20, Math.max(0.05, atual * (dir > 0 ? passo : 1 / passo))) * 1000) / 1000;
        props[k] = o[k];
      }
      aplicarPosicoes();
      postar(id, props);
    }, { passive: false });

    addEventListener('keydown', (e) => {
      enviar({ tipo: 'tecla', key: e.key, shift: e.shiftKey, ctrl: e.ctrlKey || e.metaKey });
      if (e.key.indexOf('Arrow') === 0 || ((e.ctrlKey || e.metaKey) && /^[zys]$/i.test(e.key))) e.preventDefault();
    });
    addEventListener('dragover', (e) => e.preventDefault());
    addEventListener('drop', (e) => {
      e.preventDefault();
      const t = e.target && e.target.closest ? e.target.closest('[data-el]') : null;
      const arquivos = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
      if (arquivos.length) enviar({ tipo: 'soltar', el: t ? t.dataset.el : 'fundo', arquivos: arquivos });
    });
    enviar({ tipo: 'pronto' });
  }

  // ---------------- INÍCIO ----------------
  addEventListener('resize', ajustarPalco);
  ajustarPalco();
  $('btn-sim').addEventListener('click', clicarCartao);
  $('btn-nao').addEventListener('click', clicarCartao);

  if (MODO === 'editor') {
    if (CFG) { aplicarEstilos(); mostrarEstatico(estado); }
    iniciarEditor();
  } else if (CFG) {
    aplicarEstilos();
    iniciarJogo(window.GAME_START || 0);
    if (window.parent !== window) {
      addEventListener('keydown', (e) => { if (e.key === 'Escape') enviar({ tipo: 'esc' }); });
    }
  }
})();
</script>
</body>
</html>
